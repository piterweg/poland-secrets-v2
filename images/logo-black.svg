<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 90" width="390" height="90">
  <!-- Black background version -->
  <rect width="100%" height="100%" fill="#000000"/>
  
  <!-- Icon -->
  <g transform="translate(6, 10)">
    <!-- Rounded square frame -->
    <rect x="4" y="4" width="64" height="64" rx="16" 
          fill="none" stroke="#ffffff" stroke-width="3.5"/>
    
    <!-- Sun -->
    <circle cx="36" cy="30" r="12" fill="#f0c14b"/>
    
    <!-- Horizon / path -->
    <path d="M14 48 Q25 42 36 46 Q47 50 58 44" 
          fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round"/>
    
    <!-- Accent dot -->
    <circle cx="36" cy="46" r="3.2" fill="#d96b2b"/>
  </g>
  
  <!-- Wordmark - white text -->
  <g transform="translate(90, 24)">
    <text x="0" y="24" 
          font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif" 
          font-size="30" 
          font-weight="700" 
          fill="#ffffff"
          letter-spacing="-0.6">
      Poland Secrets
    </text>
    <text x="0.5" y="48" 
          font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif" 
          font-size="11.5" 
          font-weight="500"
          fill="#a0a0a0" 
          letter-spacing="1.5">
      POLSKA BLIŻEJ · SLOW TRAVEL
    </text>
  </g>
</svg>
